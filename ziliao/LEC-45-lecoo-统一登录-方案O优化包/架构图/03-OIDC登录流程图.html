<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>03 · OIDC 登录流程图（方案 O）</title><style>
body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#0B1126;color:#E8EEFF}
.wrap{max-width:1100px;margin:0 auto;padding:28px 24px 48px}
h1{font-size:22px;margin:0 0 6px}
.sub{color:#8FA3D9;font-size:13px;margin-bottom:22px}
.card{background:#121A38;border:1px solid #24315F;border-radius:14px;padding:22px}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:#AFC3EE}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
</style></head>
<body><div class="wrap">
<h1>03 · OIDC 登录流程图（方案 O）</h1>
<p class="sub">Authorization Code + PKCE；业务本地会话与 IdP Session 分离</p>
<div class="card"><svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg">
  <text x="90" y="40" fill="#8FA3D9" font-size="12">浏览器</text>
  <text x="300" y="40" fill="#8FA3D9" font-size="12">lecoo Web/BFF</text>
  <text x="560" y="40" fill="#8FA3D9" font-size="12">Logto</text>
  <text x="780" y="40" fill="#8FA3D9" font-size="12">业务应用</text>
  <line x1="120" y1="50" x2="120" y2="520" stroke="#24315F"/>
  <line x1="340" y1="50" x2="340" y2="520" stroke="#24315F"/>
  <line x1="600" y1="50" x2="600" y2="520" stroke="#24315F"/>
  <line x1="820" y1="50" x2="820" y2="520" stroke="#24315F"/>
  <text x="130" y="90" fill="#D7E3FF" font-size="12">1. 访问受保护页</text>
  <path d="M120 100 H340" stroke="#2E9BFF" stroke-width="2"/>
  <text x="130" y="140" fill="#D7E3FF" font-size="12">2. 302 → /oidc/auth + PKCE</text>
  <path d="M340 150 H600" stroke="#8B6CFF" stroke-width="2"/>
  <text x="350" y="190" fill="#D7E3FF" font-size="12">3. 邮箱 OTP / 密码登录</text>
  <path d="M600 200 H120" stroke="#8B6CFF" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="130" y="240" fill="#D7E3FF" font-size="12">4. callback?code&amp;state</text>
  <path d="M120 250 H340" stroke="#2E9BFF" stroke-width="2"/>
  <text x="350" y="290" fill="#D7E3FF" font-size="12">5. code↔token（BFF）</text>
  <path d="M340 300 H600" stroke="#8B6CFF" stroke-width="2"/>
  <text x="350" y="340" fill="#D7E3FF" font-size="12">6. 建业务会话 + 选 Tenant</text>
  <path d="M340 350 H120" stroke="#2E9BFF" stroke-width="2"/>
  <text x="130" y="390" fill="#D7E3FF" font-size="12">7. 进入 C 端工作台</text>
  <text x="350" y="440" fill="#D7E3FF" font-size="12">8. 访问第三方应用：OIDC 再授权（同 IdP SSO）</text>
  <path d="M340 450 H820" stroke="#27AE60" stroke-width="2"/>
  <text x="130" y="500" fill="#AFC3EE" font-size="12">硬边界：凭证只在 Logto；业务 Cookie 不共享 IdP Cookie；无 CAS ticket。</text>
</svg><div class="legend"><span><i style="background:#2E9BFF"></i>BFF</span><span><i style="background:#8B6CFF"></i>Logto</span><span><i style="background:#27AE60"></i>下游应用</span></div></div>
</div></body></html>
